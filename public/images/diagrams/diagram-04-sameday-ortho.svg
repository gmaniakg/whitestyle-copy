<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-04-sameday-ortho-title diagram-04-sameday-ortho-desc" id="diagram-04-sameday-ortho-root">
        <title id="diagram-04-sameday-ortho-title">치과교정학 박사 1:1 당일 3D 정밀 진단 및 책임 교정 여정</title>
        <desc id="diagram-04-sameday-ortho-desc">3D 세팔로 정밀 계측, 치과교정학 박사 1:1 맞춤 설계, 클리피씨 및 세라믹 장치 부착, 재발 방지 유지관리로 이어지는 교정 흐름도입니다.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #diagram-04-sameday-ortho-root { color-scheme: light;
      --color-paper:       #f4f6f8;
      --color-paper-2:     #eaeef2;
      --color-ink:         #1e222b;
      --color-muted:       #465061;
      --color-soft:        #556073;
      --color-rule:        rgba(30,34,43,0.12);
      --color-rule-solid:  #b8c0cc;
      --color-accent:      #9e472a;
      --color-accent-ink:  #f4f6f8;
      --color-accent-tint: rgba(158,71,42,0.08);
      --color-link:        #234b82;
      --font-sans:   'Noto Sans KR', 'Noto Sans JP', system-ui, sans-serif;
      --font-serif:  'Noto Serif KR', 'Noto Serif', serif;
      --font-mono:   'Noto Sans Mono CJK KR', ui-monospace, monospace; }
      #diagram-04-sameday-ortho-root ::selection { background: var(--color-accent-tint); color: var(--color-ink); }
      #diagram-04-sameday-ortho-root :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
      #diagram-04-sameday-ortho-root a:active, #diagram-04-sameday-ortho-root .summary-block:active { transform: translateY(1px); }
      #diagram-04-sameday-ortho-root { font-family: var(--font-sans); color: var(--color-ink); }
      #diagram-04-sameday-ortho-root .container { max-width: 1120px; margin: 0 auto; }
      #diagram-04-sameday-ortho-root .header-eyebrow { font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--color-accent);
      margin-bottom: 0.6rem; }
      #diagram-04-sameday-ortho-root .subtitle { font-family: var(--font-sans);
      font-size: 0.96rem;
      line-height: 1.65;
      color: var(--color-muted);
      max-width: 68ch; }
      #diagram-04-sameday-ortho-root .diagram-container { background: transparent;
      border: none;
      padding: 0;
      overflow-x: auto; }
      @media print {
#diagram-04-sameday-ortho-root .diagram-container { overflow-x: visible; }
}
      #diagram-04-sameday-ortho-root .summary-grid { display: grid;
      grid-template-columns: 1.15fr 1fr 0.95fr;
      gap: 1.25rem;
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-rule); }
      @media (max-width: 860px) {
#diagram-04-sameday-ortho-root .summary-grid { grid-template-columns: 1fr; }
}
      #diagram-04-sameday-ortho-root .summary-block { background: var(--color-paper-2);
      border-radius: 6px;
      border: 1px solid var(--color-rule);
      padding: 1.15rem; }
      #diagram-04-sameday-ortho-root .summary-header { margin-bottom: 0.75rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--color-rule); }
      #diagram-04-sameday-ortho-root .summary-block h2 { font-family: var(--font-sans);
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--color-ink); }
      #diagram-04-sameday-ortho-root .summary-block ul { list-style: none;
      color: var(--color-muted);
      font-size: 0.85rem;
      line-height: 1.65; }
      #diagram-04-sameday-ortho-root .summary-block li { margin-bottom: 0.35rem;
      padding-left: 0.9rem;
      position: relative; }
      #diagram-04-sameday-ortho-root .summary-block li::before { content: '—';
      position: absolute;
      left: 0;
      color: var(--color-soft); }
      #diagram-04-sameday-ortho-root .jp-section { margin-top: 2rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--color-rule-solid); }
      #diagram-04-sameday-ortho-root .jp-title { font-family: var(--font-sans);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-ink);
      margin-bottom: 0.5rem; }
      #diagram-04-sameday-ortho-root .jp-lead { font-family: var(--font-sans);
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--color-muted); }</style>
          <marker id="diagram-04-sameday-ortho-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
