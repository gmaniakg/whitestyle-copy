        <text x="132" y="180" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">당일 3D 세팔로 계측</text>
        <text x="132" y="198" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">3D CBCT &amp; Cephalo</text>
