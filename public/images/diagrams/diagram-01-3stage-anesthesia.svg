<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-01-3stage-anesthesia-title diagram-01-3stage-anesthesia-desc" id="diagram-01-3stage-anesthesia-root">
        <title id="diagram-01-3stage-anesthesia-title">화이트스타일치과의원 3단계 통증 완화 무통 마취 프로토콜</title>
        <desc id="diagram-01-3stage-anesthesia-desc">1단계 가글 마취, 2단계 표면 도포 마취, 3단계 디지털 정압 무통 마취를 거쳐 안전한 진료로 이어지는 단계별 흐름도입니다.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #diagram-01-3stage-anesthesia-root { color-scheme: light;
      --color-paper:       #f4f6f8;
      --color-paper-2:     #eaeef2;
      --color-ink:         #1e222b;
      --color-muted:       #465061;
      --color-soft:        #556073;
      --color-rule:        rgba(30,34,43,0.12);
      --color-rule-solid:  #b8c0cc;
      --color-accent:      #9e472a;
      --color-accent-ink:  #f4f6f8;
      --color-accent-tint: rgba(158,71,42,0.08);
      --color-link:        #234b82;
      --font-sans:   'Noto Sans KR', 'Noto Sans JP', system-ui, sans-serif;
      --font-serif:  'Noto Serif KR', 'Noto Serif', serif;
      --font-mono:   'Noto Sans Mono CJK KR', ui-monospace, monospace; }
      #diagram-01-3stage-anesthesia-root ::selection { background: var(--color-accent-tint); color: var(--color-ink); }
      #diagram-01-3stage-anesthesia-root :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
      #diagram-01-3stage-anesthesia-root a:active, #diagram-01-3stage-anesthesia-root .summary-block:active { transform: translateY(1px); }
      #diagram-01-3stage-anesthesia-root { font-family: var(--font-sans); color: var(--color-ink); }
      #diagram-01-3stage-anesthesia-root .container { max-width: 1120px; margin: 0 auto; }
      #diagram-01-3stage-anesthesia-root .header-eyebrow { font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--color-accent);
      margin-bottom: 0.6rem; }
      #diagram-01-3stage-anesthesia-root .subtitle { font-family: var(--font-sans);
      font-size: 0.96rem;
      line-height: 1.65;
      color: var(--color-muted);
      max-width: 68ch; }
      #diagram-01-3stage-anesthesia-root .diagram-container { background: transparent;
      border: none;
      padding: 0;
      overflow-x: auto; }
      @media print {
#diagram-01-3stage-anesthesia-root .diagram-container { overflow-x: visible; }
}
      #diagram-01-3stage-anesthesia-root .summary-grid { display: grid;
      grid-template-columns: 1.15fr 1fr 0.95fr;
      gap: 1.25rem;
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-rule); }
      @media (max-width: 860px) {
#diagram-01-3stage-anesthesia-root .summary-grid { grid-template-columns: 1fr; }
}
      #diagram-01-3stage-anesthesia-root .summary-block { background: var(--color-paper-2);
      border-radius: 6px;
      border: 1px solid var(--color-rule);
      padding: 1.15rem; }
      #diagram-01-3stage-anesthesia-root .summary-header { margin-bottom: 0.75rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--color-rule); }
      #diagram-01-3stage-anesthesia-root .summary-block h2 { font-family: var(--font-sans);
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--color-ink); }
      #diagram-01-3stage-anesthesia-root .summary-block ul { list-style: none;
      color: var(--color-muted);
      font-size: 0.85rem;
      line-height: 1.65; }
      #diagram-01-3stage-anesthesia-root .summary-block li { margin-bottom: 0.35rem;
      padding-left: 0.9rem;
      position: relative; }
      #diagram-01-3stage-anesthesia-root .summary-block li::before { content: '—';
      position: absolute;
      left: 0;
      color: var(--color-soft); }
      #diagram-01-3stage-anesthesia-root .jp-section { margin-top: 2rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--color-rule-solid); }
      #diagram-01-3stage-anesthesia-root .jp-title { font-family: var(--font-sans);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-ink);
      margin-bottom: 0.5rem; }
      #diagram-01-3stage-anesthesia-root .jp-lead { font-family: var(--font-sans);
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--color-muted); }</style>
          <marker id="diagram-01-3stage-anesthesia-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#465061"/>
          </marker>
          <marker id="diagram-01-3stage-anesthesia-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#9e472a"/>
          </marker>
          <marker id="diagram-01-3stage-anesthesia-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#234b82"/>
          </marker>
        </defs>

        <rect x="0" y="0" width="1000" height="440" fill="#f4f6f8"/>

        <rect x="24" y="36" width="952" height="300" rx="8" fill="none" stroke="#1e222b" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.12"/>
        <text x="40" y="56" fill="#465061" font-size="8" font-weight="500" font-family="'Noto Sans Mono CJK KR', monospace" letter-spacing="0.16em">3-STAGE PAIN RELIEF ANESTHESIA PROTOCOL / WHITESTYLE DENTAL</text>

        <!-- Arrows First -->
        <line x1="216" y1="184" x2="276" y2="184" stroke="#234b82" stroke-width="1.2" marker-end="url(#diagram-01-3stage-anesthesia-arrow-link)"/>
        <rect x="228" y="164" width="36" height="12" fill="#f4f6f8"/>
        <text x="246" y="172" fill="#234b82" font-size="8" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">60 SEC</text>

        <line x1="452" y1="184" x2="512" y2="184" stroke="#9e472a" stroke-width="1.2" marker-end="url(#diagram-01-3stage-anesthesia-arrow-accent)"/>
        <rect x="464" y="164" width="36" height="12" fill="#f4f6f8"/>
        <text x="482" y="172" fill="#9e472a" font-size="8" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">120 SEC</text>

        <line x1="704" y1="184" x2="764" y2="184" stroke="#9e472a" stroke-width="1.2" marker-end="url(#diagram-01-3stage-anesthesia-arrow-accent)"/>
        <rect x="716" y="164" width="36" height="12" fill="#f4f6f8"/>
        <text x="734" y="172" fill="#9e472a" font-size="8" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">37.0 C</text>

        <!-- Node 1: 1단계 가글 마취 -->
        <rect x="48" y="136" width="168" height="96" rx="6" fill="#f4f6f8"/>
        <rect x="48" y="136" width="168" height="96" rx="6" fill="#465061" stroke="#556073" stroke-width="1" fill-opacity="0.10"/>
        <rect x="56" y="144" width="44" height="12" rx="2" fill="none" stroke="#556073" stroke-width="0.8"/>
        <text x="78" y="153" fill="#556073" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">STAGE 1</text>
        <text x="132" y="180" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">1단계 구강 가글 마취</text>
        <text x="132" y="198" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">Mucosal Gargle Prep</text>
        <text x="132" y="214" fill="#556073" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">Sensory Threshold Down</text>

        <!-- Node 2: 2단계 표면 도포 마취 -->
        <rect x="276" y="136" width="176" height="96" rx="6" fill="#f4f6f8"/>
        <rect x="276" y="136" width="176" height="96" rx="6" fill="#eaeef2" stroke="#1e222b" stroke-width="1"/>
        <rect x="284" y="144" width="44" height="12" rx="2" fill="none" stroke="#465061" stroke-width="0.8"/>
        <text x="306" y="153" fill="#1e222b" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">STAGE 2</text>
        <text x="364" y="180" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">2단계 잇몸 표면 도포 마취</text>
        <text x="364" y="198" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">Topical Gel Application</text>
        <text x="364" y="214" fill="#556073" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">Zero Needle Prick Pain</text>

        <!-- Node 3: 3단계 디지털 정압 무통 마취 (Focal) -->
        <rect x="512" y="136" width="192" height="96" rx="6" fill="#f4f6f8"/>
        <rect x="512" y="136" width="192" height="96" rx="6" fill="#9e472a" stroke="#9e472a" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="520" y="144" width="44" height="12" rx="2" fill="none" stroke="#9e472a" stroke-width="0.8"/>
        <text x="542" y="153" fill="#9e472a" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">STAGE 3</text>
        <text x="608" y="180" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">3단계 디지털 정압 무통 마취</text>
        <text x="608" y="198" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">Computer-Controlled Flow</text>
        <text x="608" y="214" fill="#9e472a" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">Body-Temp 37C Ampoule</text>

        <!-- Node 4: 안심 정밀 진료 시작 (Store) -->
        <rect x="764" y="136" width="188" height="96" rx="6" fill="#f4f6f8"/>
        <rect x="764" y="136" width="188" height="96" rx="6" fill="#1e222b" stroke="#465061" stroke-width="1" fill-opacity="0.05"/>
        <rect x="772" y="144" width="44" height="12" rx="2" fill="none" stroke="#465061" stroke-width="0.8"/>
        <text x="794" y="153" fill="#465061" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">COMFORT</text>
        <text x="858" y="180" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">3인 원장단 편안한 진료</text>
        <text x="858" y="198" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">Implant / Ortho / Ceramic</text>
        <text x="858" y="214" fill="#556073" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">Vital Sign Monitoring</text>

        <!-- Legend Strip -->
        <line x1="24" y1="364" x2="976" y2="364" stroke="#1e222b" stroke-width="1" stroke-opacity="0.12"/>
        <text x="24" y="392" fill="#1e222b" font-size="8" font-weight="500" font-family="'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="96" y="382" width="16" height="12" rx="2" fill="#465061" stroke="#556073" stroke-width="1" fill-opacity="0.10"/>
        <text x="120" y="392" fill="#465061" font-size="12" font-weight="500" font-family="'Noto Sans KR', sans-serif">1단계 구강 점막 전처치</text>

        <rect x="296" y="382" width="16" height="12" rx="2" fill="#eaeef2" stroke="#1e222b" stroke-width="1"/>
        <text x="320" y="392" fill="#465061" font-size="12" font-weight="500" font-family="'Noto Sans KR', sans-serif">2단계 표면 자입 통증 차단</text>

        <rect x="516" y="382" width="16" height="12" rx="2" fill="#9e472a" stroke="#9e472a" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="540" y="392" fill="#465061" font-size="12" font-weight="500" font-family="'Noto Sans KR', sans-serif">3단계 체온 맞춤 정압 무통 마취</text>

        <rect x="760" y="382" width="16" height="12" rx="2" fill="#1e222b" stroke="#465061" stroke-width="1" fill-opacity="0.05"/>
        <text x="784" y="392" fill="#465061" font-size="12" font-weight="500" font-family="'Noto Sans KR', sans-serif">편안한 본 진료 이행</text>
      </svg>
