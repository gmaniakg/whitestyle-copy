<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="whitestyle-clinical-architecture-kr-title whitestyle-clinical-architecture-kr-desc">
        <title id="whitestyle-clinical-architecture-kr-title">화이트스타일치과의원 3인 원장단 협진 임상 프로토콜</title>
        <desc id="whitestyle-clinical-architecture-kr-desc">3D CT 정밀 진단과 3단계 무통 마취부터 교정, 보철, 치주 3인 원장단 협진 및 6개월 정기 사후관리로 이어지는 진료 체계도입니다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#465061"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#9e472a"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#234b82"/>
          </marker>
        </defs>

        <!-- Background paper -->
        <rect x="0" y="0" width="1000" height="640" fill="#f4f6f8"/>

        <!-- Clinical Zone Boundary (all coordinates divisible by 4) -->
        <rect x="200" y="36" width="768" height="488" rx="8" fill="transparent" stroke="rgba(30,34,43,0.12)" stroke-width="1" stroke-dasharray="6,4"/>
        <text x="216" y="56" fill="#465061" font-size="8" font-weight="500" font-family="'Noto Sans Mono CJK KR', monospace" letter-spacing="0.16em">GANGNAM WHITESTYLE CLINICAL SYSTEM / B1-2F</text>

        <!-- =================================================================
             1. ARROWS FIRST (Orthogonal r=8 elbows, drawn behind all nodes)
             ================================================================= -->

        <!-- Patient Intake (x=160, y=148) -> 3D CBCT Diagnosis (x=232, y=148) -->
        <line x1="160" y1="148" x2="232" y2="148" stroke="#234b82" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="176" y="128" width="40" height="12" fill="#f4f6f8"/>
        <text x="196" y="136" fill="#234b82" font-size="8" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">STEP 1</text>

        <!-- JP Coordinator (x=160, y=340) -> 3-Stage Anesthesia (x=232, y=340) -->
        <line x1="160" y1="340" x2="232" y2="340" stroke="#234b82" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="172" y="320" width="48" height="12" fill="#f4f6f8"/>
        <text x="196" y="328" fill="#234b82" font-size="8" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">1:1 CARE</text>

        <!-- 3D CBCT (x=312, y=184) -> 3-Stage Anesthesia (x=312, y=304) -->
        <line x1="312" y1="184" x2="312" y2="304" stroke="#465061" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="320" y="236" width="56" height="12" fill="#f4f6f8"/>
        <text x="348" y="244" fill="#465061" font-size="8" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="start" letter-spacing="0.06em">3D PLAN</text>

        <!-- 3D CBCT (x=392, y=140) -> Ortho Center (x=472, y=120) via orthogonal elbow -->
        <path d="M 392 140 L 424 140 Q 432 140 432 132 L 432 128 Q 432 120 440 120 L 472 120" fill="none" stroke="#9e472a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- 3D CBCT (x=392, y=160) -> Prostho Center (x=472, y=244) via orthogonal elbow -->
        <path d="M 392 160 L 424 160 Q 432 160 432 168 L 432 236 Q 432 244 440 244 L 472 244" fill="none" stroke="#465061" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3-Stage Anesthesia (x=392, y=340) -> Perio/Implant Center (x=472, y=368) via orthogonal elbow -->
        <path d="M 392 340 L 424 340 Q 432 340 432 348 L 432 360 Q 432 368 440 368 L 472 368" fill="none" stroke="#9e472a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Ortho (x=664, y=120) -> Long-Term Warranty (x=752, y=228) -->
        <path d="M 664 120 L 704 120 Q 712 120 712 128 L 712 220 Q 712 228 720 228 L 752 228" fill="none" stroke="#465061" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Prostho (x=664, y=244) -> Long-Term Warranty (x=752, y=244) -->
        <line x1="664" y1="244" x2="752" y2="244" stroke="#465061" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="684" y="224" width="48" height="12" fill="#f4f6f8"/>
        <text x="708" y="232" fill="#465061" font-size="8" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY</text>

        <!-- Perio/Implant (x=664, y=368) -> Long-Term Warranty (x=752, y=260) -->
        <path d="M 664 368 L 704 368 Q 712 368 712 360 L 712 268 Q 712 260 720 260 L 752 260" fill="none" stroke="#9e472a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- =================================================================
             2. COMPONENT BOXES (4px grid aligned, <= 8 nodes, <= 2 focal)
             ================================================================= -->

        <!-- Node 1: 한국·일본 내원 환자 (Input) -->
        <rect x="24" y="112" width="136" height="72" rx="6" fill="#f4f6f8"/>
        <rect x="24" y="112" width="136" height="72" rx="6" fill="rgba(70,80,97,0.10)" stroke="#556073" stroke-width="1"/>
        <rect x="32" y="120" width="40" height="12" rx="2" fill="transparent" stroke="#556073" stroke-width="0.8"/>
        <text x="52" y="129" fill="#556073" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">INTAKE</text>
        <text x="92" y="152" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">예비환자 1:1 내원</text>
        <text x="92" y="168" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">KR / JP Consultation</text>

        <!-- Node 2: 일본어 전담 코디네이터 3명 상주 (Input) -->
        <rect x="24" y="304" width="136" height="72" rx="6" fill="#f4f6f8"/>
        <rect x="24" y="304" width="136" height="72" rx="6" fill="rgba(70,80,97,0.10)" stroke="#556073" stroke-width="1"/>
        <rect x="32" y="312" width="44" height="12" rx="2" fill="transparent" stroke="#556073" stroke-width="0.8"/>
        <text x="54" y="321" fill="#556073" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">GLOBAL</text>
        <text x="92" y="344" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">일본어 통역 3명 상주</text>
        <text x="92" y="360" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">LINE: whitestyle1</text>

        <!-- Node 3: 3D CT · 세팔로 정밀 진단 (Focal #1) -->
        <rect x="232" y="112" width="160" height="72" rx="6" fill="#f4f6f8"/>
        <rect x="232" y="112" width="160" height="72" rx="6" fill="rgba(158,71,42,0.08)" stroke="#9e472a" stroke-width="1.2"/>
        <rect x="240" y="120" width="36" height="12" rx="2" fill="transparent" stroke="#9e472a" stroke-width="0.8"/>
        <text x="258" y="129" fill="#9e472a" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">3D CT</text>
        <text x="312" y="152" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">3D CT 및 세팔로 진단</text>
        <text x="312" y="168" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">CBCT &amp; Cephalo Analysis</text>

        <!-- Node 4: 3단계 통증 완화 무통 마취 (Backend) -->
        <rect x="232" y="304" width="160" height="72" rx="6" fill="#f4f6f8"/>
        <rect x="232" y="304" width="160" height="72" rx="6" fill="#eaeef2" stroke="#1e222b" stroke-width="1"/>
        <rect x="240" y="312" width="44" height="12" rx="2" fill="transparent" stroke="#465061" stroke-width="0.8"/>
        <text x="262" y="321" fill="#1e222b" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">3-STEP</text>
        <text x="312" y="344" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">3단계 무통 마취 시스템</text>
        <text x="312" y="360" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">Gargle / Topical / Digital</text>

        <!-- Node 5: 치과교정학 박사 김준헌 병원장 (Focal #2) -->
        <rect x="472" y="84" width="192" height="72" rx="6" fill="#f4f6f8"/>
        <rect x="472" y="84" width="192" height="72" rx="6" fill="rgba(158,71,42,0.08)" stroke="#9e472a" stroke-width="1.2"/>
        <rect x="480" y="92" width="44" height="12" rx="2" fill="transparent" stroke="#9e472a" stroke-width="0.8"/>
        <text x="502" y="101" fill="#9e472a" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">ORTHO</text>
        <text x="568" y="124" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">김준헌 병원장 책임 교정</text>
        <text x="568" y="140" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">SNU Ph.D. Orthodontics</text>

        <!-- Node 6: 이봉진 대표원장 · 3D CT 정밀 임플란트 (Backend) -->
        <rect x="472" y="208" width="192" height="72" rx="6" fill="#f4f6f8"/>
        <rect x="472" y="208" width="192" height="72" rx="6" fill="#eaeef2" stroke="#1e222b" stroke-width="1"/>
        <rect x="480" y="216" width="52" height="12" rx="2" fill="transparent" stroke="#465061" stroke-width="0.8"/>
        <text x="506" y="225" fill="#1e222b" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">IMPLANT</text>
        <text x="568" y="248" fill="#1e222b" font-size="13" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">이봉진 대표원장 정밀 임플란트</text>
        <text x="568" y="264" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">3D CT &amp; Allograft Implant</text>

        <!-- Node 7: 박선혜 원장(치주과 전문의) · 최소삭제 심미보철 (Backend) -->
        <rect x="472" y="332" width="192" height="72" rx="6" fill="#f4f6f8"/>
        <rect x="472" y="332" width="192" height="72" rx="6" fill="#eaeef2" stroke="#1e222b" stroke-width="1"/>
        <rect x="480" y="340" width="52" height="12" rx="2" fill="transparent" stroke="#465061" stroke-width="0.8"/>
        <text x="506" y="349" fill="#1e222b" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">CERAMIC</text>
        <text x="568" y="372" fill="#1e222b" font-size="13" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">박선혜 원장 최소삭제 심미보철</text>
        <text x="568" y="388" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">0.1-0.3mm Laminate &amp; Perio</text>

        <!-- Node 8: 6개월 정기 검진 · 사후 보증 관리 (Store) -->
        <rect x="752" y="208" width="184" height="72" rx="6" fill="#f4f6f8"/>
        <rect x="752" y="208" width="184" height="72" rx="6" fill="rgba(30,34,43,0.05)" stroke="#465061" stroke-width="1"/>
        <rect x="760" y="216" width="40" height="12" rx="2" fill="transparent" stroke="#465061" stroke-width="0.8"/>
        <text x="780" y="225" fill="#465061" font-size="7" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.08em">CARE</text>
        <text x="844" y="248" fill="#1e222b" font-size="12" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">정기 검진 및 사후 보증</text>
        <text x="844" y="264" fill="#465061" font-size="9" font-family="'Noto Sans Mono CJK KR', monospace" text-anchor="middle">6-Month Follow-Up System</text>

        <!-- =================================================================
             3. HORIZONTAL BOTTOM LEGEND STRIP (Outside zone boundary y=524)
             ================================================================= -->
        <line x1="24" y1="556" x2="968" y2="556" stroke="rgba(30,34,43,0.12)" stroke-width="1"/>
        <text x="24" y="584" fill="#1e222b" font-size="8" font-weight="500" font-family="'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="96" y="574" width="16" height="12" rx="2" fill="rgba(158,71,42,0.08)" stroke="#9e472a" stroke-width="1.2"/>
        <text x="120" y="584" fill="#465061" font-size="12" font-weight="500" font-family="'Noto Sans KR', sans-serif">핵심 정밀 진단 및 책임 교정</text>

        <rect x="296" y="574" width="16" height="12" rx="2" fill="#eaeef2" stroke="#1e222b" stroke-width="1"/>
        <text x="320" y="584" fill="#465061" font-size="12" font-weight="500" font-family="'Noto Sans KR', sans-serif">원장단 분과별 협진 프로토콜</text>

        <rect x="516" y="574" width="16" height="12" rx="2" fill="rgba(30,34,43,0.05)" stroke="#465061" stroke-width="1"/>
        <text x="540" y="584" fill="#465061" font-size="12" font-weight="500" font-family="'Noto Sans KR', sans-serif">사후 보증 및 정기 관리</text>

        <rect x="700" y="574" width="16" height="12" rx="2" fill="rgba(70,80,97,0.10)" stroke="#556073" stroke-width="1"/>
        <text x="724" y="584" fill="#465061" font-size="12" font-weight="500" font-family="'Noto Sans KR', sans-serif">환자 상담 및 일본어 통역 상주</text>
      </svg>